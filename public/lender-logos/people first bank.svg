<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120" fill="none">
  <!-- Stylized PF Mark -->
  <g transform="translate(18, 22)">
    <!-- Lilac/Purple Top-Left Pill -->
    <rect x="0" y="0" width="16" height="16" rx="8" fill="#9D72CF" />
    
    <!-- Emerald Green Bottom-Left Stem -->
    <rect x="0" y="24" width="16" height="52" rx="8" fill="#06CB62" />
    
    <!-- Cyan/Sky-Blue Semi-Circle Loop -->
    <path d="M 28 0 A 26 26 0 0 1 54 26 A 26 26 0 0 1 28 52 Z" fill="#3BCFED" />
  </g>
  
  <!-- Typography: Deep Indigo / Navy -->
  <g transform="translate(90, 22)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#210D74" letter-spacing="-0.5">People First</text>
    <text x="0" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#210D74" letter-spacing="-0.5">Bank</text>
